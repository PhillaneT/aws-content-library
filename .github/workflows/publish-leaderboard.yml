name: Publish leaderboard snapshot

on:
  workflow_dispatch:

# GitHub's own native cron scheduler used to be a second trigger here
# (`schedule: - cron: "*/10 * * * *"`, later loosened to */15 as a first
# attempt at a fix), running alongside an external cron-job.org ping that
# calls workflow_dispatch every ~15 min. Removed for good 2026-08-06: the
# native scheduler is documented by GitHub as best-effort
# and can silently run 30+ min late under load — confirmed live when it fired
# at 15:41 instead of its 15:40 slot, then collided with the next
# cron-job.org-triggered run before the first had a runner assigned. With
# `cancel-in-progress: false`, a NEW run doesn't touch one that's already
# RUNNING, but it does supersede one still sitting QUEUED — so back-to-back
# triggers from two independent sources kept bumping each other out of the
# queue before either could start, and the page went ~1h49m without a
# successful publish. cron-job.org alone is the sole scheduler now; it was
# the one firing on time throughout the incident.
permissions:
  contents: write

concurrency:
  group: "leaderboard-publish"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # A hung step (e.g. a slow/unresponsive Raven360 or Moodle call) used to
    # sit on GitHub's default 360-minute job timeout, holding the concurrency
    # slot and queuing out every trigger behind it. 8 minutes is generous
    # against the ~80s worst-case Moodle full sweep (see server.py) plus
    # checkout/setup/pip install — a run that's still going past that is
    # stuck, not just slow, and should free the slot for the next trigger.
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Write config.json from secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: python -c "import os; open('config.json','w',encoding='utf-8').write(os.environ['CONFIG_JSON'])"

      - name: Restore manual_data/ from secret
        env:
          MANUAL_DATA_B64: ${{ secrets.MANUAL_DATA_B64 }}
        run: |
          python -c "
          import base64, os
          data = base64.b64decode(os.environ['MANUAL_DATA_B64'])
          open('manual_data.zip', 'wb').write(data)
          "
          mkdir -p manual_data
          python -c "import zipfile; zipfile.ZipFile('manual_data.zip').extractall('manual_data')"
          rm -f manual_data.zip

      - name: Generate snapshot
        env:
          RAVEN360_CLIENT_ID: ${{ secrets.RAVEN360_CLIENT_ID }}
          RAVEN360_CLIENT_SECRET: ${{ secrets.RAVEN360_CLIENT_SECRET }}
          RAVEN360_XAPI_KEY: ${{ secrets.RAVEN360_XAPI_KEY }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
        run: python generate_snapshot.py

      - name: Clean up local-only files (never committed)
        run: rm -rf config.json manual_data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cloud_Skills_Leaderboard.html
          if git diff --cached --quiet; then
            echo "No change in leaderboard content — skipping commit."
            exit 0
          fi
          git commit -m "Auto-update leaderboard snapshot"

          # cron-job.org fires every ~15 min, and a manual "Run workflow" click can
          # still land in the same window as a scheduled one. The file is fully
          # machine-regenerated every run, so there's nothing to genuinely merge —
          # on a rejected push, rebase this run's one commit onto whatever a sibling
          # run just published and retry; if that itself conflicts, just concede to
          # the sibling run's already-published (near-identical) snapshot rather
          # than fail the job.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — a sibling run published first. Rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflicted; conceding to the sibling run's snapshot."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Giving up after 5 attempts; leaving remote as the sibling run left it."
